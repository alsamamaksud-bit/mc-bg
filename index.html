<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Day/Night Wallpaper</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: url('c1.png') 2 2, auto;
  }

  video, div, span { cursor: inherit; }

  a, button, .clickable, [role="button"], input, select, textarea {
    cursor: url('c2.png') 4 2, pointer !important;
  }

  video {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    pointer-events: none;
  }

  /* ============================================================
     DRIFTING CLOUDS
     ============================================================ */
  .clouds {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    opacity: 0.55;
    mix-blend-mode: screen;
  }

  .cloud {
    position: absolute;
    background: radial-gradient(ellipse at center,
      rgba(255, 255, 255, 0.9) 0%,
      rgba(255, 255, 255, 0.6) 40%,
      rgba(255, 255, 255, 0) 70%);
    border-radius: 50%;
    filter: blur(30px);
    will-change: transform;
  }

  /* Each cloud is a cluster of blobs to feel puffy */
  .cloud::before,
  .cloud::after {
    content: '';
    position: absolute;
    background: inherit;
    border-radius: 50%;
    filter: blur(30px);
  }
  .cloud::before {
    width: 70%;
    height: 70%;
    top: 15%;
    left: -30%;
  }
  .cloud::after {
    width: 80%;
    height: 80%;
    top: 10%;
    left: 40%;
  }

  /* Individual cloud animations — different speeds and sizes */
  .cloud.c1 {
    width: 380px; height: 140px;
    top: 8%;
    left: -30%;
    animation: drift 180s linear infinite;
    animation-delay: 0s;
  }
  .cloud.c2 {
    width: 520px; height: 180px;
    top: 18%;
    left: -40%;
    animation: drift 240s linear infinite;
    animation-delay: -60s;
    opacity: 0.7;
  }
  .cloud.c3 {
    width: 300px; height: 110px;
    top: 4%;
    left: -25%;
    animation: drift 150s linear infinite;
    animation-delay: -90s;
    opacity: 0.5;
  }
  .cloud.c4 {
    width: 440px; height: 150px;
    top: 28%;
    left: -35%;
    animation: drift 210s linear infinite;
    animation-delay: -130s;
    opacity: 0.6;
  }
  .cloud.c5 {
    width: 260px; height: 100px;
    top: 12%;
    left: -20%;
    animation: drift 130s linear infinite;
    animation-delay: -40s;
    opacity: 0.45;
  }

  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(100vw + 600px)); }
  }

  /* ============================================================
     FLOATING PARTICLES (dust motes / pollen)
     ============================================================ */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(255, 250, 220, 0.7);
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255, 250, 200, 0.5);
    animation: float linear infinite;
    will-change: transform, opacity;
  }

  @keyframes float {
    0% {
      transform: translateY(0) translateX(0);
      opacity: 0;
    }
    10% { opacity: 0.8; }
    90% { opacity: 0.6; }
    100% {
      transform: translateY(-100vh) translateX(60px);
      opacity: 0;
    }
  }

  /* ============================================================
     MINECRAFT CLOCK
     ============================================================ */
  .clock {
    position: fixed;
    top: 28px;
    right: 28px;
    padding: 16px 22px 14px 22px;
    background: linear-gradient(180deg,
      rgba(60, 60, 60, 0.85) 0%,
      rgba(30, 30, 30, 0.9) 100%);
    border: 4px solid #1a1a1a;
    border-top-color: #6a6a6a;
    border-left-color: #5a5a5a;
    border-right-color: #2a2a2a;
    border-bottom-color: #0a0a0a;
    box-shadow:
      4px 4px 0 rgba(0, 0, 0, 0.6),
      8px 8px 0 rgba(0, 0, 0, 0.35);
    color: #ffffff;
    text-align: center;
    user-select: none;
    pointer-events: none;
    z-index: 10;
    font-family: 'Press Start 2P', monospace;
  }

  .clock-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .clock .time {
    font-size: 1.4rem;
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow: 2px 2px 0 #3f3f3f, 4px 4px 0 rgba(0, 0, 0, 0.6);
    line-height: 1.4;
  }

  .clock .ampm {
    font-size: 0.6rem;
    color: #ffff55;
    text-shadow: 2px 2px 0 #3f3f00, 3px 3px 0 rgba(0, 0, 0, 0.6);
    margin-top: 2px;
  }

  .clock .divider {
    height: 2px;
    background: #1a1a1a;
    border-top: 1px solid #5a5a5a;
    margin: 8px 0 10px 0;
  }

  .clock .date {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.55rem;
    letter-spacing: 1px;
    color: #aaaaaa;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7);
  }

  .clock .date .dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    background: #55ff55;
    box-shadow: 1px 1px 0 #1a3a1a;
    flex-shrink: 0;
  }

  .clock .phase {
    position: absolute;
    top: -14px;
    right: -14px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    line-height: 1;
    background: #8b8b8b;
    border: 4px solid #1a1a1a;
    border-top-color: #c6c6c6;
    border-left-color: #c6c6c6;
    border-right-color: #555;
    border-bottom-color: #373737;
    box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
    text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.6);
  }

  @media (max-width: 700px) {
    .clock {
      top: 14px; right: 14px;
      padding: 10px 14px 8px 14px;
      border-width: 3px;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.6), 5px 5px 0 rgba(0,0,0,0.3);
    }
    .clock .time { font-size: 0.9rem; }
    .clock .ampm { font-size: 0.45rem; }
    .clock .date { font-size: 0.42rem; }
    .clock .phase {
      width: 28px; height: 28px; font-size: 0.85rem;
      top: -10px; right: -10px; border-width: 3px;
    }
    .cloud { filter: blur(20px); }
  }
</style>
</head>
<body>

<video id="bg" muted playsinline preload="auto">
  <source src="https://files.catbox.moe/qlhyap.mp4" type="video/mp4">
</video>

<!-- drifting clouds -->
<div class="clouds">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
  <div class="cloud c5"></div>
</div>

<!-- floating particles -->
<div class="particles" id="particles"></div>

<div class="clock">
  <div class="phase" id="clockPhase">☀</div>
  <div class="clock-row">
    <span class="time" id="clockTime">--:--</span>
    <span class="ampm" id="clockAmPm"></span>
  </div>
  <div class="divider"></div>
  <div class="date">
    <span id="clockDay">---</span>
    <span class="dot"></span>
    <span id="clockMonth">---</span>
    <span id="clockDateNum">--</span>
  </div>
</div>

<script>
  // ============================================================
  //  SETTINGS
  // ============================================================
  const VIDEO_START_HOUR = 6;
  const VIDEO_DURATION   = 104;

  // ============================================================
  //  DAY/NIGHT VIDEO SYNC
  // ============================================================
  const REAL_DAY = 86400;
  const video = document.getElementById('bg');

  function getVideoPosition() {
    const now = new Date();
    const secondsToday =
      now.getHours() * 3600 +
      now.getMinutes() * 60 +
      now.getSeconds();
    const offsetSeconds = VIDEO_START_HOUR * 3600;
    const adjusted = (secondsToday - offsetSeconds + REAL_DAY) % REAL_DAY;
    return (adjusted / REAL_DAY) * VIDEO_DURATION;
  }

  video.addEventListener('loadedmetadata', () => {
    const dur = video.duration || VIDEO_DURATION;
    video.currentTime = getVideoPosition();
    video.pause();

    setInterval(() => {
      let next = video.currentTime + (dur / REAL_DAY);
      if (next >= dur) next -= dur;
      video.currentTime = next;
    }, 1000);
  });

  video.addEventListener('canplay', () => {
    video.play().then(() => video.pause()).catch(() => {});
  });

  // ============================================================
  //  PARTICLES
  // ============================================================
  const particleContainer = document.getElementById('particles');
  const PARTICLE_COUNT = 35;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = document.createElement('div');
    p.className = 'particle';

    // Random size
    const size = 2 + Math.random() * 4;
    p.style.width  = size + 'px';
    p.style.height = size + 'px';

    // Random starting position
    p.style.left = Math.random() * 100 + 'vw';
    p.style.top  = (60 + Math.random() * 40) + 'vh';

    // Random animation duration (slower = calmer)
    const duration = 18 + Math.random() * 25;
    p.style.animationDuration = duration + 's';

    // Random delay so they don't all start together
    p.style.animationDelay = (-Math.random() * duration) + 's';

    // Random horizontal drift
    p.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');

    // Slight opacity variation
    p.style.opacity = 0.3 + Math.random() * 0.5;

    particleContainer.appendChild(p);
  }

  // ============================================================
  //  CLOCK
  // ============================================================
  const clockTime    = document.getElementById('clockTime');
  const clockAmPm    = document.getElementById('clockAmPm');
  const clockDay     = document.getElementById('clockDay');
  const clockMonth   = document.getElementById('clockMonth');
  const clockDateNum = document.getElementById('clockDateNum');
  const clockPhase   = document.getElementById('clockPhase');

  const DAYS   = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    let h12 = h % 12;
    if (h12 === 0) h12 = 12;

    clockTime.textContent = String(h12).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    clockAmPm.textContent = ampm;
    clockDay.textContent     = DAYS[now.getDay()];
    clockMonth.textContent   = MONTHS[now.getMonth()];
    clockDateNum.textContent = String(now.getDate()).padStart(2, '0');
    clockPhase.textContent = (h >= 6 && h < 18) ? '☀' : '☾';
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
