<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Day/Night Wallpaper</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: url('c1.png') 2 2, auto;
  }

  * { cursor: inherit; }

  a, button, .clickable, [role="button"], input, select, textarea {
    cursor: url('c2.png') 4 2, pointer !important;
  }

  video {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    pointer-events: none;
    filter: contrast(1.08) saturate(1.1);
  }

  /* ============ CLOUDS — night only ============ */
  .clouds {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    opacity: 0.22;
    transition: opacity 2s ease;
  }
  .clouds.night { opacity: 0; }

  .cloud {
    position: absolute;
    background: radial-gradient(ellipse at center,
      rgba(255, 255, 255, 0.7) 0%,
      rgba(255, 255, 255, 0.35) 40%,
      rgba(255, 255, 255, 0) 70%);
    border-radius: 50%;
    filter: blur(22px);
    will-change: transform;
  }
  .cloud::before,
  .cloud::after {
    content: '';
    position: absolute;
    background: inherit;
    border-radius: 50%;
    filter: blur(22px);
  }
  .cloud::before { width: 70%; height: 70%; top: 15%; left: -30%; }
  .cloud::after  { width: 80%; height: 80%; top: 10%; left: 40%; }

  .cloud.c1 { width: 380px; height: 140px; top: 8%;  left: -30%; animation: drift 180s linear infinite; animation-delay: 0s; }
  .cloud.c2 { width: 520px; height: 180px; top: 18%; left: -40%; animation: drift 240s linear infinite; animation-delay: -60s; opacity: 0.7; }
  .cloud.c3 { width: 300px; height: 110px; top: 4%;  left: -25%; animation: drift 150s linear infinite; animation-delay: -90s; opacity: 0.5; }
  .cloud.c4 { width: 440px; height: 150px; top: 28%; left: -35%; animation: drift 210s linear infinite; animation-delay: -130s; opacity: 0.6; }
  .cloud.c5 { width: 260px; height: 100px; top: 12%; left: -20%; animation: drift 130s linear infinite; animation-delay: -40s; opacity: 0.45; }

  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(100vw + 600px)); }
  }

  /* ============ NIGHT DUST MOTES ============ */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
    opacity: 0.9;
    transition: opacity 2s ease;
  }
  .particles.night { opacity: 0; }

  .particle {
    position: absolute;
    background: radial-gradient(circle at center,
      rgba(255, 245, 220, 1) 0%,
      rgba(255, 235, 180, 0.7) 40%,
      rgba(255, 235, 180, 0) 100%);
    border-radius: 50%;
    box-shadow:
      0 0 12px rgba(255, 230, 150, 0.8),
      0 0 24px rgba(255, 220, 120, 0.45);
    animation: float linear infinite, twinkle ease-in-out infinite alternate;
    will-change: transform, opacity;
  }

  @keyframes float {
    0%   { transform: translate(0, 0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.8; }
    100% { transform: translate(40px, -100vh); opacity: 0; }
  }
  @keyframes twinkle {
    from { filter: brightness(0.8); }
    to   { filter: brightness(1.5); }
  }

  /* ============ DAY POLLEN ============ */
  .day-particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    overflow: hidden;
    opacity: 0;
    transition: opacity 2s ease;
  }
  .day-particles.day { opacity: 1; }

  .day-particle {
    position: absolute;
    border-radius: 50%;
    image-rendering: pixelated;
    background: #f0e6c8;
    box-shadow:
      0 0 0 1px rgba(120, 90, 30, 0.35),
      0 0 6px rgba(255, 230, 150, 0.7),
      0 0 12px rgba(255, 220, 120, 0.4);
    animation: dayFloat linear infinite, dayTwinkle ease-in-out infinite alternate;
    will-change: transform, opacity;
  }

  @keyframes dayFloat {
    0%   { transform: translate(0, 0); opacity: 0; }
    8%   { opacity: 0.9; }
    92%  { opacity: 0.7; }
    100% { transform: translate(-30px, -100vh); opacity: 0; }
  }
  @keyframes dayTwinkle {
    from { filter: brightness(0.85); }
    to   { filter: brightness(1.3); }
  }

  /* ============ MINECRAFT RAIN — 3px × 11px ============ */
  .rain-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
    transition: opacity 2s ease;
  }
  .rain-layer.night { opacity: 0; }

  .raindrop {
    position: absolute;
    width: 3px;
    height: 11px;
    background: #4a7fbf;
    image-rendering: pixelated;
    will-change: transform;
  }

  @keyframes dropFall {
    from { transform: translateY(0); }
    to   { transform: translateY(110vh); }
  }

  /* ============ CLOCK ============ */
  .clock {
    position: fixed;
    top: 28px; right: 28px;
    padding: 16px 22px 14px 22px;
    background: linear-gradient(180deg, rgba(60,60,60,0.85) 0%, rgba(30,30,30,0.9) 100%);
    border: 4px solid #1a1a1a;
    border-top-color: #6a6a6a;
    border-left-color: #5a5a5a;
    border-right-color: #2a2a2a;
    border-bottom-color: #0a0a0a;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.6), 8px 8px 0 rgba(0,0,0,0.35);
    color: #fff;
    text-align: center;
    user-select: none;
    pointer-events: none;
    z-index: 10;
    font-family: 'Press Start 2P', monospace;
  }
  .clock-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
  .clock .time { font-size: 1.4rem; letter-spacing: 2px; color: #fff; text-shadow: 2px 2px 0 #3f3f3f, 4px 4px 0 rgba(0,0,0,0.6); line-height: 1.4; }
  .clock .ampm { font-size: 0.6rem; color: #ffff55; text-shadow: 2px 2px 0 #3f3f00, 3px 3px 0 rgba(0,0,0,0.6); margin-top: 2px; }
  .clock .divider { height: 2px; background: #1a1a1a; border-top: 1px solid #5a5a5a; margin: 8px 0 10px 0; }
  .clock .date { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.55rem; letter-spacing: 1px; color: #aaa; text-shadow: 2px 2px 0 rgba(0,0,0,0.7); }
  .clock .date .dot { display: inline-block; width: 4px; height: 4px; background: #55ff55; box-shadow: 1px 1px 0 #1a3a1a; flex-shrink: 0; }
  .clock .phase { position: absolute; top: -14px; right: -14px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; line-height: 1; background: #8b8b8b; border: 4px solid #1a1a1a; border-top-color: #c6c6c6; border-left-color: #c6c6c6; border-right-color: #555; border-bottom-color: #373737; box-shadow: 2px 2px 0 rgba(0,0,0,0.5); text-shadow: 1px 1px 0 rgba(0,0,0,0.6); }

  /* ============ DEBUG PANEL — hidden by default ============ */
  .debug {
    position: fixed; bottom: 24px; left: 24px;
    padding: 14px 16px;
    background: rgba(20,20,20,0.9);
    border: 3px solid #1a1a1a;
    border-top-color: #6a6a6a;
    border-left-color: #5a5a5a;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.55rem;
    z-index: 20;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.6);
    min-width: 300px;
    transition: opacity 0.2s;
    opacity: 0;
    pointer-events: none;
  }
  .debug.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .debug h3 { font-size: 0.6rem; color: #ffff55; margin-bottom: 10px; letter-spacing: 1px; }
  .debug .row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
  .debug .row label { width: 60px; color: #aaa; font-size: 0.5rem; }
  .debug input[type="range"] { flex: 1; accent-color: #55ff55; height: 6px; }
  .debug .value { color: #55ff55; min-width: 70px; text-align: right; font-size: 0.55rem; }
  .debug button {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.5rem;
    padding: 6px 8px;
    background: #6a6a6a; color: #fff;
    border: 3px solid #1a1a1a;
    border-top-color: #a0a0a0;
    border-left-color: #a0a0a0;
    border-right-color: #333;
    border-bottom-color: #222;
    cursor: pointer;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.6);
    letter-spacing: 1px;
  }
  .debug button:hover { background: #7a7a7a; }
  .debug button.active { background: #55aa55; border-top-color: #88dd88; border-left-color: #88dd88; }
  .debug .presets button { flex: 1; padding: 5px 4px; font-size: 0.45rem; }

  /* ============ ADMIN PANEL ============ */
  .admin {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    padding: 24px 28px;
    background: linear-gradient(180deg,
      rgba(30, 20, 40, 0.95) 0%,
      rgba(15, 10, 25, 0.98) 100%);
    border: 4px solid #1a1a1a;
    border-top-color: #aa44ff;
    border-left-color: #aa44ff;
    border-right-color: #4a1a7a;
    border-bottom-color: #2a0a4a;
    box-shadow:
      0 0 0 3px #2a1a3a,
      0 0 60px rgba(170, 68, 255, 0.6),
      8px 8px 0 rgba(0,0,0,0.7);
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.6rem;
    z-index: 100;
    min-width: 400px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  .admin.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  .admin h2 {
    font-size: 0.85rem;
    color: #cc88ff;
    text-shadow:
      2px 2px 0 #4a1a7a,
      0 0 12px rgba(200, 130, 255, 0.8);
    margin-bottom: 6px;
    letter-spacing: 2px;
    text-align: center;
  }

  .admin .subtitle {
    font-size: 0.45rem;
    color: #aa88dd;
    text-align: center;
    margin-bottom: 18px;
    letter-spacing: 1px;
    opacity: 0.8;
  }

  .admin .section {
    margin-bottom: 14px;
    padding: 10px 12px;
    background: rgba(60, 30, 90, 0.35);
    border: 2px solid #4a1a7a;
    border-top-color: #7a3aaa;
  }

  .admin .section-title {
    font-size: 0.5rem;
    color: #cc88ff;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .admin .row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .admin button {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.48rem;
    padding: 7px 10px;
    background: #4a2a6a;
    color: #fff;
    border: 3px solid #1a1a1a;
    border-top-color: #9a5aca;
    border-left-color: #9a5aca;
    border-right-color: #2a0a4a;
    border-bottom-color: #1a003a;
    cursor: pointer;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.7);
    letter-spacing: 1px;
    transition: background 0.15s;
  }

  .admin button:hover {
    background: #6a3a9a;
  }

  .admin button.active {
    background: #aa55dd;
    border-top-color: #dd99ff;
    border-left-color: #dd99ff;
  }

  .admin .close {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 4px 8px;
    font-size: 0.5rem;
    background: #5a1a1a;
    border-top-color: #aa4444;
    border-left-color: #aa4444;
    border-right-color: #3a0a0a;
    border-bottom-color: #2a0000;
  }

  .admin .close:hover {
    background: #7a2a2a;
  }

  .admin .hint {
    font-size: 0.42rem;
    color: #8866aa;
    text-align: center;
    margin-top: 14px;
    letter-spacing: 1px;
  }

  @media (max-width: 700px) {
    .clock { top: 14px; right: 14px; padding: 10px 14px 8px 14px; border-width: 3px; box-shadow: 3px 3px 0 rgba(0,0,0,0.6), 5px 5px 0 rgba(0,0,0,0.3); }
    .clock .time { font-size: 0.9rem; }
    .clock .ampm { font-size: 0.45rem; }
    .clock .date { font-size: 0.42rem; }
    .clock .phase { width: 28px; height: 28px; font-size: 0.85rem; top: -10px; right: -10px; border-width: 3px; }
    .cloud { filter: blur(15px); }
    .debug { font-size: 0.5rem; min-width: 250px; padding: 10px; }
    .admin { min-width: 300px; padding: 18px; }
  }
</style>
</head>
<body>

<video id="bg" muted playsinline preload="auto">
  <source src="https://files.catbox.moe/qlhyap.mp4" type="video/mp4">
</video>

<div class="clouds" id="cloudLayer">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
  <div class="cloud c5"></div>
</div>

<div class="particles" id="particles"></div>

<div class="day-particles" id="dayParticles"></div>

<div class="rain-layer" id="rainLayer"></div>

<div class="clock">
  <div class="phase" id="clockPhase">☀</div>
  <div class="clock-row">
    <span class="time" id="clockTime">--:--</span>
    <span class="ampm" id="clockAmPm"></span>
  </div>
  <div class="divider"></div>
  <div class="date">
    <span id="clockDay">---</span>
    <span class="dot"></span>
    <span id="clockMonth">---</span>
    <span id="clockDateNum">--</span>
  </div>
</div>

<!-- DEBUG PANEL — hidden by default, only visible via admin toggle -->
<div class="debug" id="debugPanel">
  <h3>⏱ DEBUG</h3>
  <div class="row">
    <label>TIME</label>
    <input type="range" id="timeSlider" min="0" max="1439" value="720">
    <span class="value" id="timeSliderVal">12:00</span>
  </div>
  <div class="row presets">
    <button data-preset="0">12 AM</button>
    <button data-preset="6">6 AM</button>
    <button data-preset="12">12 PM</button>
    <button data-preset="18">6 PM</button>
  </div>
  <div class="row">
    <label>SPEED</label>
    <button data-speed="1">1×</button>
    <button data-speed="60">60×</button>
    <button data-speed="600">600×</button>
    <button data-speed="3600">3600×</button>
  </div>
  <div class="row">
    <label>REAL</label>
    <span class="value" id="realTimeVal" style="text-align:left; flex:1;">--:--</span>
    <button id="resetBtn">RESET</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin" id="adminPanel">
  <button class="close" id="adminClose">✕</button>
  <h2>⚡ ADMIN ACCESS ⚡</h2>
  <div class="subtitle">SYSTEM CONTROL PANEL</div>

  <div class="section">
    <div class="section-title">🛠 DEVELOPER</div>
    <div class="row">
      <button id="adminDebugToggle">TOGGLE DEBUG PANEL</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">⚡ RAIN CONTROL</div>
    <div class="row">
      <button id="adminRain">TRIGGER RAIN</button>
      <button id="adminRainStop">STOP RAIN</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🌍 TIME CONTROL</div>
    <div class="row">
      <button data-admin-time="6">DAWN</button>
      <button data-admin-time="12">NOON</button>
      <button data-admin-time="18">DUSK</button>
      <button data-admin-time="0">MIDNIGHT</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🎛 LAYER TOGGLES</div>
    <div class="row">
      <button data-admin-toggle="clouds">CLOUDS</button>
      <button data-admin-toggle="particles">MOTES</button>
      <button data-admin-toggle="dayParticles">POLLEN</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">💥 CHAOS</div>
    <div class="row">
      <button id="adminStorm">⚡ STORM MODE</button>
      <button id="adminReset">RESET ALL</button>
    </div>
  </div>

  <div class="hint">TYPE "admin access" TO TOGGLE</div>
</div>

<script>
  const VIDEO_START_HOUR = 6;
  const VIDEO_DURATION   = 104;
  const REAL_DAY         = 86400;

  const video = document.getElementById('bg');

  let debugMode    = false;
  let debugMinutes = null;
  let timeScale    = 1;
  let lastTick     = performance.now();

  function getRealMinutes() {
    const now = new Date();
    return now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  }
  function getCurrentMinutes() {
    return debugMode ? debugMinutes : getRealMinutes();
  }
  function getVideoPosition(minutes) {
    const secondsToday = minutes * 60;
    const offsetSeconds = VIDEO_START_HOUR * 3600;
    const adjusted = (secondsToday - offsetSeconds + REAL_DAY) % REAL_DAY;
    return (adjusted / REAL_DAY) * VIDEO_DURATION;
  }
  function seekVideo() {
    if (!video.duration) return;
    video.currentTime = getVideoPosition(getCurrentMinutes());
  }

  video.addEventListener('loadedmetadata', () => {
    seekVideo();
    video.pause();
  });
  video.addEventListener('canplay', () => {
    video.play().then(() => video.pause()).catch(() => {});
  });

  // ---------- NIGHT DUST MOTES ----------
  const particleContainer = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 3 + Math.random() * 4;
    p.style.width  = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.top  = (40 + Math.random() * 60) + 'vh';
    const duration = 25 + Math.random() * 25;
    p.style.animationDuration = `${duration}s, ${3 + Math.random() * 4}s`;
    p.style.animationDelay = `-${Math.random() * duration}s, -${Math.random() * 4}s`;
    p.style.opacity = 0.7 + Math.random() * 0.3;
    particleContainer.appendChild(p);
  }

  // ---------- DAY POLLEN ----------
  const dayParticles = document.getElementById('dayParticles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'day-particle';
    const size = 2 + Math.random() * 3;
    p.style.width  = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.top  = (40 + Math.random() * 60) + 'vh';
    const duration = 20 + Math.random() * 20;
    p.style.animationDuration = `${duration}s, ${2 + Math.random() * 3}s`;
    p.style.animationDelay = `-${Math.random() * duration}s, -${Math.random() * 3}s`;
    dayParticles.appendChild(p);
  }

  // ---------- RAIN ----------
  const rainLayer = document.getElementById('rainLayer');
  const FALL_DURATION = 2.2;
  let rainTimeout = null;

  function spawnDrop() {
    const drop = document.createElement('div');
    drop.className = 'raindrop';
    drop.style.left = Math.random() * 100 + 'vw';
    drop.style.animation = `dropFall ${FALL_DURATION}s linear forwards`;
    rainLayer.appendChild(drop);
    setTimeout(() => drop.remove(), FALL_DURATION * 1000 + 100);
  }

  function scheduleNextDrop() {
    const delay = 8000 + Math.random() * 12000;
    rainTimeout = setTimeout(() => {
      spawnDrop();
      scheduleNextDrop();
    }, delay);
  }
  scheduleNextDrop();

  function forceRainBurst() {
    for (let i = 0; i < 40; i++) {
      setTimeout(spawnDrop, i * 80);
    }
  }

  function stopAllRain() {
    if (rainTimeout) clearTimeout(rainTimeout);
    rainLayer.innerHTML = '';
  }

  // ---------- CLOCK ----------
  const clockTime    = document.getElementById('clockTime');
  const clockAmPm    = document.getElementById('clockAmPm');
  const clockDay     = document.getElementById('clockDay');
  const clockMonth   = document.getElementById('clockMonth');
  const clockDateNum = document.getElementById('clockDateNum');
  const clockPhase   = document.getElementById('clockPhase');
  const DAYS   = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  function minutesToClock(minutes) {
    let h = Math.floor(minutes / 60) % 24;
    const m = Math.floor(minutes % 60);
    const ampm = h >= 12 ? 'PM' : 'AM';
    let h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return String(h12).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ' ' + ampm;
  }
  function updateClock(minutes) {
    const h = Math.floor(minutes / 60) % 24;
    const m = Math.floor(minutes % 60);
    const ampm = h >= 12 ? 'PM' : 'AM';
    let h12 = h % 12;
    if (h12 === 0) h12 = 12;
    clockTime.textContent = String(h12).padStart(2,'0') + ':' + String(m).padStart(2,'0');
    clockAmPm.textContent = ampm;
    const now = new Date();
    clockDay.textContent     = DAYS[now.getDay()];
    clockMonth.textContent   = MONTHS[now.getMonth()];
    clockDateNum.textContent = String(now.getDate()).padStart(2,'0');
    clockPhase.textContent = (h >= 6 && h < 18) ? '☀' : '☾';
  }

  // ---------- DEBUG PANEL ----------
  const debugPanel    = document.getElementById('debugPanel');
  const timeSlider    = document.getElementById('timeSlider');
  const timeSliderVal = document.getElementById('timeSliderVal');
  const realTimeVal   = document.getElementById('realTimeVal');
  const resetBtn      = document.getElementById('resetBtn');
  const speedBtns     = document.querySelectorAll('[data-speed]');
  const presetBtns    = document.querySelectorAll('[data-preset]');

  timeSlider.value = Math.floor(getRealMinutes());
  timeSliderVal.textContent = minutesToClock(getRealMinutes());

  timeSlider.addEventListener('input', () => {
    debugMode = true;
    debugMinutes = parseFloat(timeSlider.value);
    timeSliderVal.textContent = minutesToClock(debugMinutes);
  });

  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      debugMode = true;
      const h = parseFloat(btn.dataset.preset);
      debugMinutes = h * 60;
      timeSlider.value = debugMinutes;
      timeSliderVal.textContent = minutesToClock(debugMinutes);
      presetBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  speedBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      timeScale = parseFloat(btn.dataset.speed);
      speedBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  document.querySelector('[data-speed="1"]').classList.add('active');

  resetBtn.addEventListener('click', () => {
    debugMode = false;
    timeScale = 1;
    debugMinutes = null;
    speedBtns.forEach(b => b.classList.remove('active'));
    document.querySelector('[data-speed="1"]').classList.add('active');
    presetBtns.forEach(b => b.classList.remove('active'));
  });

  setInterval(() => {
    realTimeVal.textContent = minutesToClock(getRealMinutes());
  }, 1000);

  // ---------- MAIN LOOP ----------
  const cloudLayer = document.getElementById('cloudLayer');
  let forceNight = false;
  let forceDay = false;

  function tick(now) {
    const dt = (now - lastTick) / 1000;
    lastTick = now;

    if (debugMode) {
      debugMinutes += (dt * timeScale) / 60;
      if (debugMinutes >= 1440) debugMinutes -= 1440;
      timeSlider.value = Math.floor(debugMinutes);
      timeSliderVal.textContent = minutesToClock(debugMinutes);
    }

    seekVideo();
    updateClock(getCurrentMinutes());

    const hour = getCurrentMinutes() / 60;
    let isDay = hour >= 8 && hour < 20;
    if (forceDay) isDay = true;
    if (forceNight) isDay = false;
    const isNight = !isDay;

    rainLayer.classList.toggle('night', !isDay);
    dayParticles.classList.toggle('day', isDay);
    cloudLayer.classList.toggle('night', !isNight);
    particleContainer.classList.toggle('night', !isNight);

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ============================================================
  //  ADMIN ACCESS
  // ============================================================
  const adminPanel = document.getElementById('adminPanel');
  const TARGET = 'admin access';
  let typedBuffer = '';

  document.addEventListener('keydown', (e) => {
    // Ignore typing inside form fields
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key.length !== 1) return;

    typedBuffer += e.key.toLowerCase();
    if (typedBuffer.length > TARGET.length) {
      typedBuffer = typedBuffer.slice(-TARGET.length);
    }

    if (typedBuffer === TARGET) {
      typedBuffer = '';
      adminPanel.classList.toggle('show');
    }
  });

  document.getElementById('adminClose').addEventListener('click', () => {
    adminPanel.classList.remove('show');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') adminPanel.classList.remove('show');
  });

  // ---- Debug toggle ----
  document.getElementById('adminDebugToggle').addEventListener('click', (e) => {
    debugPanel.classList.toggle('visible');
    e.target.classList.toggle('active', debugPanel.classList.contains('visible'));
  });

  // ---- Rain ----
  document.getElementById('adminRain').addEventListener('click', forceRainBurst);
  document.getElementById('adminRainStop').addEventListener('click', stopAllRain);

  // ---- Time presets ----
  document.querySelectorAll('[data-admin-time]').forEach(btn => {
    btn.addEventListener('click', () => {
      debugMode = true;
      const h = parseFloat(btn.dataset.adminTime);
      debugMinutes = h * 60;
      timeSlider.value = debugMinutes;
      timeSliderVal.textContent = minutesToClock(debugMinutes);
      forceDay = false;
      forceNight = false;
    });
  });

  // ---- Layer toggles ----
  const toggleState = {
    clouds: true,
    particles: true,
    dayParticles: true
  };

  document.querySelectorAll('[data-admin-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.adminToggle;
      toggleState[key] = !toggleState[key];
      btn.classList.toggle('active', !toggleState[key]);

      if (key === 'clouds') {
        cloudLayer.style.display = toggleState.clouds ? '' : 'none';
      } else if (key === 'particles') {
        particleContainer.style.display = toggleState.particles ? '' : 'none';
      } else if (key === 'dayParticles') {
        dayParticles.style.display = toggleState.dayParticles ? '' : 'none';
      }
    });
  });

  // ---- Storm ----
  document.getElementById('adminStorm').addEventListener('click', () => {
    forceRainBurst();
    for (let s = 0; s < 6; s++) {
      setTimeout(forceRainBurst, s * 500);
    }
    video.style.transition = 'filter 0.5s ease';
    video.style.filter = 'contrast(1.2) saturate(0.8) brightness(0.7)';
    setTimeout(() => {
      video.style.filter = 'contrast(1.08) saturate(1.1)';
    }, 4000);
  });

  // ---- Reset ----
  document.getElementById('adminReset').addEventListener('click', () => {
    forceDay = false;
    forceNight = false;
    debugMode = false;
    timeScale = 1;
    debugMinutes = null;
    stopAllRain();
    scheduleNextDrop();

    toggleState.clouds = true;
    toggleState.particles = true;
    toggleState.dayParticles = true;
    cloudLayer.style.display = '';
    particleContainer.style.display = '';
    dayParticles.style.display = '';
    document.querySelectorAll('[data-admin-toggle]').forEach(b => b.classList.remove('active'));

    speedBtns.forEach(b => b.classList.remove('active'));
    document.querySelector('[data-speed="1"]').classList.add('active');

    // Hide the debug panel again
    debugPanel.classList.remove('visible');
    document.getElementById('adminDebugToggle').classList.remove('active');
  });
</script>

</body>
</html>
